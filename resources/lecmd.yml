name: LECmd

type:
  - Tool

description: >
  Command-line forensic parser for Windows shortcut (LNK)
  files. Extracts target paths, timestamps, volume information,
  network share details, shell items and distributed link
  tracking metadata to support user activity reconstruction
  and forensic timeline analysis.

