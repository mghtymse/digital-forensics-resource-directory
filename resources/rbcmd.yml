name: RBCmd

type:
  - Tool

description: >
  Command-line forensic parser for Windows Recycle Bin
  artefacts, including modern $I files and legacy INFO2
  records. Extracts original file paths, file sizes and
  deletion timestamps to support examination of deleted
  file activity.

website: https://ericzimmerman.github.io/

repository: https://github.com/EricZimmerman/RBCmd

author: Eric Zimmerman

domains:
  - Windows Forensics
  - Filesystem Forensics
  - Timeline Analysis

runs_on:
  - Windows
  - Linux
  - macOS

analyses:
  - Windows

artefacts:
  - Recycle Bin
  - Deleted Files

keywords:
  - File Deletion
  - $Recycle.Bin
  - $I Files
  - INFO2
  - Deletion Timestamps
  - User Activity
  - EZ Tools

pricing:
  model: Free
  commercial_use: true

open_source: true

licence: MIT

status: Active

