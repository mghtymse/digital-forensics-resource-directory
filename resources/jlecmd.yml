name: JLECmd

type:
  - Tool

description: >
  Command-line forensic parser for Windows Automatic and
  Custom Destination Jump Lists. Extracts application
  identifiers, destination records, timestamps and embedded
  shortcut metadata to support forensic reconstruction of
  user activity and file access history.

