  Automated benchmarking framework for evaluating digital
  forensic tools, scripts and AI-generated code against
  documented NIST test cases using standardised quantitative
  performance metrics.
website: https://github.com/akila-UCD/AutoDFBench
repository: https://github.com/akila-UCD/AutoDFBench
author: Akila Wickramasekara and contributors

domains:
