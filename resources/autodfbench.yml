  - Windows
  - macOS
  - Linux
  - Container
analyses:
  - Windows
artefacts:
  - Windows Registry
  - Deleted Files
  - SQLite Databases
  - SQLite Write-Ahead Logs (WAL)
keywords:
  - Benchmarking
  - Precision
  - Recall
  - F1 Score
  - Ground Truth
  - Automation
  - Tool Validation
  - Research
  - Reproducibility

pricing:
  model: Free
  commercial_use: true

open_source: true
licence: Apache-2.0

