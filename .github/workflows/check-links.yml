
name: Check Resource Links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"
      timezone: "Australia/Brisbane"

permissions:
  contents: read

jobs:
  check-links:
    name: Check resource URLs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check resource links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress 'resources/**/*.yml'
          fail: true
          failIfEmpty: true
          jobSummary: true
