name: Validate resource records

on:
  push:
    paths:
      - 'resources/**'
      - 'taxonomy/vocabulary.yml'
      - 'scripts/validate_resources.py'
      - '.github/workflows/validate-resources.yml'
  pull_request:
    paths:
      - 'resources/**'
      - 'taxonomy/vocabulary.yml'
      - 'scripts/validate_resources.py'
      - '.github/workflows/validate-resources.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Check resources
        run: python scripts/validate_resources.py
